<svg
  width="240"
  height="240"
  viewBox="0 0 240 240"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Left blue diamond -->
  <rect
    x="60"
    y="60"
    width="120"
    height="120"
    rx="8"
    transform="rotate(45 120 120)"
    fill="#1f5fd1"
  />

  <!-- Right green diamond -->
  <rect
    x="80"
    y="60"
    width="120"
    height="120"
    rx="8"
    transform="rotate(45 140 120)"
    fill="#6ad0c2"
    opacity="0.9"
  />

  <!-- Center light-blue diamond -->
  <rect
    x="70"
    y="70"
    width="100"
    height="100"
    rx="8"
    transform="rotate(45 120 120)"
    fill="#4cc3ee"
  />

  <!-- White circle -->
  <circle cx="120" cy="120" r="26" fill="#ffffff" />

  <!-- Three dots -->
  <circle cx="113" cy="113" r="4" fill="#4cc3ee" />
  <circle cx="127" cy="113" r="4" fill="#4cc3ee" />
  <circle cx="120" cy="128" r="4" fill="#4cc3ee" />
</svg>
