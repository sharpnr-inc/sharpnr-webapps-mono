<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand identity assets (see /public/README.txt) -->
    <link rel="icon" type="image/svg+xml" href="/mark-color-dark-bg.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/mark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/mark-16.png" />
    <link rel="apple-touch-icon" href="/icons/app-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/mark-black.svg" color="#2B3AE8" />

    <!-- SEO -->
    <title>
      Silo — PostgreSQL, object storage, Drive, and data lake in one platform
    </title>
    <meta
      name="description"
      content="Silo is Sharpnr's all-in-one data platform: managed PostgreSQL, S3-compatible object storage with CDN delivery, a Drive for everyday files, and a data lake and warehouse — behind one API and one permission model."
    />
    <meta
      name="keywords"
      content="all-in-one data platform, object storage, S3-compatible storage, managed PostgreSQL, database provisioning, cloud drive, file sharing, data lake, data warehouse, Parquet, CDN storage, Sharpnr, Silo"
    />
    <meta name="author" content="Sharpnr" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="canonical" href="https://silo.sharpnr.com/" />

    <!-- Machine-readable summaries for AI crawlers -->
    <link
      rel="alternate"
      type="text/plain"
      title="llms.txt"
      href="/llms.txt"
    />
    <link
      rel="alternate"
      type="text/plain"
      title="llms-full.txt"
      href="/llms-full.txt"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Theme: brand ink -->
    <meta name="theme-color" content="#0C0D0F" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:locale" content="en" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silo" />
    <meta
      property="og:title"
      content="Silo — Every kind of data, one platform"
    />
    <meta
      property="og:description"
      content="Sharpnr's all-in-one data platform. Managed PostgreSQL, object storage, Drive, data lakes and warehouses — one API, one permission model, one audit trail."
    />
    <meta property="og:url" content="https://silo.sharpnr.com" />
    <meta
      property="og:image"
      content="https://silo.sharpnr.com/banners/og-image-1200x630.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Silo-Engine" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Silo — Every kind of data, one platform"
    />
    <meta
      name="twitter:description"
      content="Self-hosted object storage, PostgreSQL provisioning, and data lake infrastructure from Sharpnr."
    />
    <meta
      name="twitter:image"
      content="https://silo.sharpnr.com/banners/og-image-1200x630.png"
    />

    <!-- Paint the brand ink before React mounts, and behind overscroll. -->
    <style>
      html,
      body {
        background-color: #0c0d0f;
      }
    </style>
