packages:
  - "apps/*"
  - "packages/*"

overrides:
  # vite-plugin-top-level-await (orchestrator) calls @swc/core's printSync,
  # whose API changed in 1.16. npm's hoisting used to land on 1.15.33; pin it
  # until the plugin supports 1.16+.
  "@swc/core": 1.15.33

# Single source of truth for shared dependency versions. Apps write
# "catalog:" instead of a literal version, so one edit here moves every app.
# This is what stops the drift that put @sharpnr/ui on three different
# versions across the suite.
catalog:
  # react
  react: ^19.2.6
  react-dom: ^19.2.6
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^24.13.2

  # build toolchain
  vite: ^8.0.12
  "@vitejs/plugin-react": ^6.0.1
  typescript: ~6.0.2
  vitest: ^4.1.8

  # styling
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # tanstack
  "@tanstack/react-router": ^1.168.22
  "@tanstack/router-plugin": ^1.168.6
  "@tanstack/react-query": ^5.99.0

  # ui primitives
  radix-ui: ^1.6.0
  # Individual primitives. Several apps import these directly rather than
  # through the radix-ui umbrella, so they must be declared, not inherited.
  # Ranges mirror @sharpnr/ui's peerDependencies.
  "@radix-ui/react-dialog": ^1.1.6
  "@radix-ui/react-select": ^2.1.0
  "@radix-ui/react-tabs": ^1.1.13
  "@radix-ui/react-visually-hidden": ^1.1.0
  lucide-react: ^1.16.0
  framer-motion: ^12.39.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  cmdk: ^1.1.1
  embla-carousel-react: ^8.6.0
  gsap: ^3.14.2

  # data
  axios: ^1.15.0
  zod: ^4.3.6
  zustand: ^5.0.12

allowBuilds:
  # both ship native binaries and must run their install scripts
  '@swc/core': true
  esbuild: true

# NOTE: eslint and its plugins are deliberately NOT catalogued. orchestrator and
# sharp-iam are on eslint 9, packages/ui is on eslint 10, which is a breaking
# config change. Lint is not part of `build`, so unifying it is a separate task.
