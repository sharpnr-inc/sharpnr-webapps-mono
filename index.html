<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Sharpnr | Enterprise CRM, HRMS & Accounting Software</title>
    <meta
      name="description"
      content="Sharpnr is a unified enterprise platform offering integrated CRM, HRMS, and Accounting software to streamline operations and drive business growth."
    />
    <meta
      name="keywords"
      content="CRM, HRMS, Accounting Software, Enterprise Resource Planning, Business Automation, Sharpnr, Human Resource Management, Customer Relationship Management"
    />
    <meta name="author" content="Sharpnr" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://sharpnr.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sharpnr" />
    <meta property="og:url" content="https://sharpnr.com" />
    <meta
      property="og:title"
      content="Sharpnr | Enterprise CRM, HRMS & Accounting Software"
    />
    <meta
      property="og:description"
      content="Streamline your business with Sharpnr's unified OS. Integrated CRM, HRMS, and Accounting solutions for modern enterprises."
    />
    <meta
      property="og:image"
      content="https://sharpnr.com/public/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sharpnr Enterprise Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sharpnr" />
    <meta name="twitter:creator" content="@sharpnr" />
    <meta
      name="twitter:title"
      content="Sharpnr | Enterprise CRM, HRMS & Accounting Software"
    />
    <meta
      name="twitter:description"
      content="Streamline your business with Sharpnr's unified OS. Integrated CRM, HRMS, and Accounting solutions for modern enterprises."
    />
    <meta
      name="twitter:image"
      content="https://sharpnr.com/public/og-image.jpg"
    />
    <meta name="twitter:image:alt" content="Sharpnr Enterprise Platform" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.sharpnr.com/shicon.svg"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.sharpnr.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sharpnr",
        "url": "https://sharpnr.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://sharpnr.com/public/AppIcon.jpg",
          "width": 512,
          "height": 512
        },
        "description": "Sharpnr is a unified enterprise platform offering integrated CRM, HRMS, and Accounting software to streamline operations and drive business growth.",
        "foundingDate": "2024",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@sharpnr.com",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://twitter.com/sharpnr",
          "https://linkedin.com/company/sharpnr"
        ]
      }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sharpnr",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://sharpnr.com",
        "description": "Unified enterprise platform with CRM, HRMS, and Accounting modules.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Contact for enterprise pricing"
        },
        "featureList": [
          "Customer Relationship Management (CRM)",
          "Human Resource Management System (HRMS)",
          "Accounting & Financial Management",
          "Business Process Automation",
          "Enterprise Reporting & Analytics"
        ]
      }
    </script>

    <!-- Structured Data: WebSite (enables Sitelinks Searchbox) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sharpnr",
        "url": "https://sharpnr.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://sharpnr.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
